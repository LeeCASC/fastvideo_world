      - transformer_blocks.41.attn.to_k
      - transformer_blocks.41.attn.to_v
      - transformer_blocks.41.attn.to_out
      - transformer_blocks.42.attn.to_q
      - transformer_blocks.42.attn.to_k
      - transformer_blocks.42.attn.to_v
      - transformer_blocks.42.attn.to_out
      - transformer_blocks.43.attn.to_q
      - transformer_blocks.43.attn.to_k
      - transformer_blocks.43.attn.to_v
      - transformer_blocks.43.attn.to_out
      - transformer_blocks.44.attn.to_q
      - transformer_blocks.44.attn.to_k
      - transformer_blocks.44.attn.to_v
      - transformer_blocks.44.attn.to_out
      - transformer_blocks.45.attn.to_q
      - transformer_blocks.45.attn.to_k
      - transformer_blocks.45.attn.to_v
      - transformer_blocks.45.attn.to_out
      - transformer_blocks.46.attn.to_q
      - transformer_blocks.46.attn.to_k
      - transformer_blocks.46.attn.to_v
      - transformer_blocks.46.attn.to_out
      - transformer_blocks.47.attn.to_q
      - transformer_blocks.47.attn.to_k
      - transformer_blocks.47.attn.to_v
      - transformer_blocks.47.attn.to_out
      - transformer_blocks.48.attn.to_q
      - transformer_blocks.48.attn.to_k
      - transformer_blocks.48.attn.to_v
      - transformer_blocks.48.attn.to_out
      - transformer_blocks.49.attn.to_q
      - transformer_blocks.49.attn.to_k
      - transformer_blocks.49.attn.to_v
      - transformer_blocks.49.attn.to_out
    train_lora: true
    vision_only_conditioning: true
    normalize_camera_translation: false
    require_rebased_camera: true
    prope_use_camera_intrinsics: true
    action_motion_loss_weight: 1.0
    action_learning_rate: 0.0001
    action_embedding_scale: 1.0
    action_normalization_mode: asinh
    action_normalized_clip: 5.0
    action_channel_scales: [1.0762284994, 1.0331004858, 0.2594933808, 0.0699104741, 0.1344467252, 0.0127297146]
    minimum_video_noise_sigma: 0.5
    motion_balanced_sampling: true
    motion_balanced_num_buckets: 4
    enable_gradient_checkpointing_type: full
    attention_backend: TORCH_SDPA
    lora:
      enable: true
      rank: 64
      alpha: 64
      target_modules: [to_q, to_k, to_v, to_out]
method:
  _target_: fastvideo.train.methods.fine_tuning.worldmodel.MiniMaxH3WorldModelFineTuneMethod
  temporal_delta_weight: 0.15
  temporal_delta_warmup_steps: 100
  latent_motion_weight: 0.1
  latent_motion_direction_weight: 0.05
  latent_motion_lowpass_kernel: 2
  latent_motion_max_shift: 2
  latent_motion_temperature: 0.05
  camera_ranking_weight: 2.0
  camera_ranking_margin_ratio: 0.05
  camera_ranking_every_microbatches: 4
  camera_counterfactual_variants: [reverse, static]
  camera_counterfactual_same_input: true
  camera_static_paired_target: false
  camera_sensitivity_weight: 0.0
  camera_response_range_weight: 0.0
training:
  distributed:
    num_gpus: 8
    sp_size: 2
    tp_size: 1
    hsdp_replicate_dim: 2
    hsdp_shard_dim: 4
    pin_cpu_memory: true
  data:
    data_path: /datacc05/lizihao/worldmodel/fastvideowm_full_65389_20260927/preprocessed/all
    preprocessed_data_type: h3_worldmodel_prope
    dataloader_num_workers: 2
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 20261002
    num_latent_t: 37
    num_height: 480
    num_width: 832
    num_frames: 124
  optimizer:
    learning_rate: 0.00002
    betas: [0.9, 0.99]
    weight_decay: 0.001
    lr_scheduler: constant_with_warmup
    lr_warmup_steps: 100
  loop:
    max_train_steps: 2000
    gradient_accumulation_steps: 8
  checkpoint:
    output_dir: /datacc05/lizihao/worldmodel/fastvideowm_strong_action_full_20261002/runs/train/checkpoints
    training_state_checkpointing_steps: 100
    checkpoints_total_limit: 25
    resume_from_checkpoint: ''
  tracker:
    trackers: [wandb]
    project_name: fastvideo_worldmodel
    run_name: h3_full_action_strong_20261002
  model:
    precondition_outputs: false
    enable_gradient_checkpointing_type: full
  dit_precision: bf16
callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0
    error_if_nonfinite: true
  worldmodel_validation:
    _target_: fastvideo.train.callbacks.worldmodel_validation.WorldModelLossValidationCallback
    data_path: /datacc05/lizihao/worldmodel/fastvideowm_action_only_early_20260926/data/preprocessed/validation
    every_steps: 100
    num_batches: 12
    seed: 20261002
    run_at_start: true
pipeline:
  dit_config:
    action_dim: 12
    action_modulation_mode: film
    action_adapter_hidden_dim: 128
    action_injection_interval: 1
    action_post_adaln: true
    action_channelwise_gates: true
    action_residual_scale: 1.0
    action_residual_clip: 1.0
    prope_dim_range: [96, 120]
    prope_mode: exact
    prope_parallel_residual_interval: 0
