models:
  student:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3WorldModel
    init_from: /datacc05/lizihao_wm/worldmodel/ckpts/MiniMax-H3
    trainable: true
    camera_conditioning: hybrid
    action_representation: relative_pose_delta
    paired_supervision: false
    trainable_modules:
      - action_encoder
      - action_adapter
      - action_block_gates
      - proj_in
      - norm_out
      - proj_out
      - transformer_blocks.38.attn.to_q
      - transformer_blocks.38.attn.to_k
      - transformer_blocks.38.attn.to_v
      - transformer_blocks.38.attn.to_out
      - transformer_blocks.39.attn.to_q
      - transformer_blocks.39.attn.to_k
      - transformer_blocks.39.attn.to_v
      - transformer_blocks.39.attn.to_out
      - transformer_blocks.40.attn.to_q
      - transformer_blocks.40.attn.to_k
      - transformer_blocks.40.attn.to_v
      - transformer_blocks.40.attn.to_out
