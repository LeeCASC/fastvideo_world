# MiniMax-H3 camera-control recovery from checkpoint-250.
# Load model weights only, then train PRoPE gates and attention LoRA with
# camera-sensitive losses. Audio and pretrained H3 boundary layers stay frozen.

models:
  student:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3WorldModel
    init_from: /datacc05/lizihao_wm/worldmodel/ckpts/MiniMax-H3
    init_from_training_checkpoint: /datacc05/lizihao_wm/worldmodel_prope/runs/minimax_h3_stage0_camera_prope_lora16_bs64/checkpoints/checkpoint-250
    checkpoint_init_modules:
      - proj_in
      - norm_out
      - proj_out
    trainable: true
    camera_conditioning: prope
    trainable_modules: []
    action_channel_scales: [0.03, 0.04, 0.02, 0.01, 0.05, 0.005]
    action_normalized_clip: 5.0
    action_embedding_scale: 16.0
    action_motion_loss_weight: 2.0
    prope_learning_rate: 1.0e-4
    prope_strength: 4.0
    # Cosmos applies the complete projective transform. Keep a learnable
    # per-head residual around that full-strength geometric baseline.
    prope_base_strength: 1.0
    prope_use_camera_intrinsics: false
    motion_balanced_sampling: true
    motion_balanced_num_buckets: 4
    enable_gradient_checkpointing_type: full
    attention_backend: TORCH_SDPA
    lora:
      enable: true
      rank: 16
      alpha: 16
      target_modules:
        - to_q
        - to_k
        - to_v
        - to_out

method:
  _target_: fastvideo.train.methods.fine_tuning.worldmodel.MiniMaxH3WorldModelFineTuneMethod
  temporal_delta_weight: 0.25
  temporal_delta_warmup_steps: 10
  # Directly require the correct pose to beat a static counterfactual on the
  # same flow-matching objective. This is the action-causal training signal.
  camera_ranking_weight: 1.0
  camera_ranking_margin_ratio: 0.05
  camera_ranking_every_microbatches: 1

training:
  distributed:
    num_gpus: 8
    sp_size: 2
    tp_size: 1
    hsdp_replicate_dim: 4
    hsdp_shard_dim: 2
    pin_cpu_memory: true

  data:
    data_path: /datacc05/lizihao_wm/worldmodel_prope/preprocessed/train
    preprocessed_data_type: h3_worldmodel_prope
    dataloader_num_workers: 2
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 20260828
    num_latent_t: 37
    num_height: 480
    num_width: 832
    num_frames: 124

  optimizer:
    learning_rate: 2.0e-5
    betas: [0.9, 0.999]
    weight_decay: 0.01
    lr_scheduler: constant_with_warmup
    lr_warmup_steps: 10

  loop:
    max_train_steps: 50
    # 1 sample/SP group x 4 data-parallel groups x 16 accumulation = 64.
    gradient_accumulation_steps: 16

  checkpoint:
    output_dir: /datacc05/lizihao_wm/worldmodel_prope/runs/minimax_h3_stage0_prope_recovery_ckpt250_bs64/checkpoints
    training_state_checkpointing_steps: 10
    checkpoints_total_limit: 8
    resume_from_checkpoint: ""

  tracker:
    trackers: [wandb]
    project_name: fastvideo_worldmodel
    run_name: minimax_h3_stage0_prope_recovery_ckpt250_bs64

  model:
    precondition_outputs: false
    enable_gradient_checkpointing_type: full

  dit_precision: bf16

callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0
  worldmodel_validation:
    _target_: fastvideo.train.callbacks.worldmodel_validation.WorldModelLossValidationCallback
    data_path: /datacc05/lizihao_wm/worldmodel_prope/preprocessed/validation
    every_steps: 10
    num_batches: 8
    seed: 20260828
    run_at_start: true

pipeline:
  dit_config:
    action_dim: 0
    prope_dim_range: [96, 108]
