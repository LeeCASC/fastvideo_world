models:
  student:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3WorldModel
    init_from: /datacc05/lizihao_wm/worldmodel/ckpts/MiniMax-H3
    trainable: true
    camera_conditioning: hybrid
    action_representation: relative_pose_delta
    paired_supervision: true
    trainable_modules: [action_encoder, action_adapter, action_block_gates, proj_in, norm_out, proj_out]
    train_lora: true
    vision_only_conditioning: true
    normalize_camera_translation: false
    require_rebased_camera: true
    prope_use_camera_intrinsics: true
    action_motion_loss_weight: 0.0
    action_learning_rate: 0.0001
    action_embedding_scale: 1.0
    action_normalized_clip: 5.0
    sampling_index_path: /datacc05/lizihao/worldmodel/fastvideowm_camera_pair_night_20260930/train_indices.json
    enable_gradient_checkpointing_type: full
    attention_backend: TORCH_SDPA
    lora:
      enable: true
      rank: 64
      alpha: 64
      target_modules: [to_q, to_k, to_v, to_out]
    action_channel_scales: [1.0762284994, 1.0331004858, 0.2594933808, 0.0699104741, 0.1344467252, 0.0127297146]
    fixed_video_noise_sigma: 1.0
method:
  _target_: fastvideo.train.methods.fine_tuning.worldmodel.MiniMaxH3WorldModelFineTuneMethod
  temporal_delta_weight: 0.1
  temporal_delta_warmup_steps: 20
  paired_flow_weight: 1.0
  paired_difference_weight: 0.25
  paired_require_identical_noisy_input: true
  camera_ranking_weight: 0.0
  camera_sensitivity_weight: 0.0
  camera_response_range_weight: 0.0
  camera_counterfactual_variants: [reverse, static]
training:
  distributed:
    num_gpus: 8
    sp_size: 2
    tp_size: 1
    hsdp_replicate_dim: 2
    hsdp_shard_dim: 4
    pin_cpu_memory: true
  data:
    data_path: /datacc05/lizihao/worldmodel/fastvideowm_camera_film_pair_20261001/data
    preprocessed_data_type: h3_worldmodel_prope_pair
    dataloader_num_workers: 2
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 20261001
    num_latent_t: 37
    num_height: 480
    num_width: 832
    num_frames: 124
  optimizer:
    learning_rate: 0.00005
    betas: [0.9, 0.99]
    weight_decay: 0.001
    lr_scheduler: constant_with_warmup
    lr_warmup_steps: 20
  loop:
    max_train_steps: 200
    gradient_accumulation_steps: 2
  checkpoint:
    output_dir: /datacc05/lizihao/worldmodel/fastvideowm_camera_film_pair_20261001/runs/high_noise/checkpoints
    training_state_checkpointing_steps: 10
    checkpoints_total_limit: 12
    resume_from_checkpoint: ''
  tracker:
    trackers: [wandb]
    project_name: fastvideo_worldmodel
    run_name: h3_camera_film_pair_high_20261001
  model:
    precondition_outputs: false
    enable_gradient_checkpointing_type: full
  dit_precision: bf16
callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0
    error_if_nonfinite: true
  worldmodel_validation:
    _target_: fastvideo.train.callbacks.worldmodel_validation.WorldModelLossValidationCallback
    data_path: /datacc05/lizihao/worldmodel/fastvideowm_action_only_early_20260926/data/preprocessed/validation
    every_steps: 50
    num_batches: 2
    seed: 20261001
    run_at_start: false
pipeline:
  dit_config:
    action_dim: 12
    action_modulation_mode: film
    action_adapter_hidden_dim: 128
    action_injection_interval: 1
    action_residual_scale: 0.1
    action_residual_clip: 1.0
    prope_dim_range: [96, 108]
    prope_mode: exact
    prope_parallel_residual_interval: 0
